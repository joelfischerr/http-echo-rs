[package]
name = "echo"
version = "0.1.0"
edition = "2021"
description = "A simple HTTP server that echoes the request body. It optionally adds a header field to the response. Heavily inspired by https://github.com/TechEmpower/FrameworkBenchmarks/blob/master/frameworks/Rust/hyper/"

[dependencies]
albedo-rust = { path = "../../../../../../../../../developer/rust-projects/albedo-rust" }
anyhow = "1.0.89"
axum = "0.8.1"
clap = { version = "4.5.3", features = ["derive"] }
futures-util = "0.3.31"
http-body-util = "0.1.3"
log = "0.4.25"
modsecurity = "1.0.0"
tokio = { version = "1.36.0", features = ["full"] }
tokio-stream = "0.1.17"
tracing-subscriber = { version = "^0.3.16", features = ["env-filter"] }
#debug = true
